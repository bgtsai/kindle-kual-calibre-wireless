# calibre-wireless settings — one key=value per line, # starts a comment.
# Changed by the KUAL menu; you can also edit it over USB.

# File names of received books (calibre itself always sends pinyin names):
#   traditional = Traditional Chinese (繁體)   simplified = Simplified Chinese (简体)
#   original    = exactly as the title is in calibre
# Only affects books received after the change.
filename_chinese=traditional

# Library "Recent" sort, applied when a connection ends (on / off):
#   pin_calibre_book = keep the "Calibre 連線" book first: its last-opened time is set to
#                      now + pin_days days, so books you open meanwhile stay below it
#   kual_last        = put KUAL last (last-opened time 2000-01-01). Opening KUAL moves it
#                      to the top again until the next connection ends.
# Turning one off just stops changing it; the old time is not restored.
pin_calibre_book=on
pin_days=365
kual_last=on
