# calibre-wireless settings — one key=value per line, # starts a comment.
# Changed by the KUAL menu; you can also edit it over USB.

# File names of received books (calibre itself always sends pinyin names):
#   traditional = Traditional Chinese (繁體)   simplified = Simplified Chinese (简体)
#   original    = exactly as the title is in calibre
# Only affects books received after the change.
filename_chinese=traditional
