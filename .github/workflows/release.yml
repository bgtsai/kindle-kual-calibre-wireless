# 推送到 main 且 kindle/ 或 src/ 有變動時：讀 config.xml 的 <version>，
# 該版本還沒有 Release 就編譯 ARM 版 client、打包 calibre-wireless.zip 並發布 v{version}。
# zip 內容＝kindle/ 底下的東西（extensions/calibre-wireless/ 與 documents/ 的書本按鈕）
# 加上編譯好的 extensions/calibre-wireless/bin/calibre-wireless；
# 使用者解壓後整包放進 Kindle 根目錄即可。
# 為什麼用 Actions：Claude 雲端環境不能建 tag／Release（見知識庫 27 第 9 條）；
# 二進位檔不進 repo，只在 Release 裡。
name: Release

on:
  push:
    branches: [main]
    paths: ['kindle/**', 'src/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' kindle/extensions/calibre-wireless/config.xml | head -1)
          [ -n "$v" ] || { echo "version not found in kindle/extensions/calibre-wireless/config.xml"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Skip if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists, skipping."
          fi

      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists != '1'
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build ARM client
        if: steps.check.outputs.exists != '1'
        # Oasis 2 是 ARMv7（kernel 4.1.15-lab126）；靜態連結，不依賴 Kindle 上的 libc
        run: |
          cd src
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o ../kindle/extensions/calibre-wireless/bin/calibre-wireless .

      - name: Build zip
        if: steps.check.outputs.exists != '1'
        run: |
          chmod 755 kindle/extensions/calibre-wireless/bin/*
          cd kindle && zip -r ../calibre-wireless.zip extensions $( [ -d documents ] && echo documents )

      - name: Create release
        if: steps.check.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" calibre-wireless.zip \
            --title "calibre-wireless ${{ steps.ver.outputs.tag }}" \
            --notes "Download **calibre-wireless.zip**, unzip it, and copy everything inside (\`extensions\` and \`documents\` folders) to the root of your Kindle drive. See README for details."
